approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# @next/eslint-plugin-next depends on @eslint-community/eslint-utils, which needs a
# peer `eslint`, but the plugin only lists eslint in devDependencies — so it cannot
# forward one to its descendant. Upstream packaging bug; declare the peer ourselves.
packageExtensions:
  "@next/eslint-plugin-next@*":
    peerDependencies:
      eslint: "^6.0.0 || ^7.0.0 || >=8.0.0"
